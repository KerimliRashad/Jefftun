            <blockquote>
            <b>⚠️ Windows ругается «SmartScreen защитил ваш компьютер»?</b><br>
            Это нормально для новых программ без платной подписи. Нажми
            <b>«Подробнее» → «Выполнить в любом случае»</b> — приложение безопасно.
            </blockquote>

            <p align="center">
              <a href="https://zyng.online"><img src="https://img.shields.io/badge/🌐_Сайт-zyng.online-5B8CFF?style=for-the-badge"></a>
              <a href="https://t.me/zyngfast"><img src="https://img.shields.io/badge/Telegram-@zyngfast-2AABEE?style=for-the-badge&logo=telegram&logoColor=white"></a>
            </p>
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS убран: раннеры дорогие и держат очередь. Windows/Linux не зависят от него.

  # ── LINUX ────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install pyinstaller customtkinter pillow pyyaml
      - name: Download xray-core (Linux 64-bit)
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p xray_bin && unzip -o xray.zip -d xray_bin
          cp xray_bin/xray qipcall_client/xray
          chmod +x qipcall_client/xray
      - name: Download sing-box (Linux 64-bit)
        run: |
          url=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep browser_download_url | grep 'linux-amd64.tar.gz' | grep -v abi | head -1 | cut -d'"' -f4)
          curl -L -o sb.tar.gz "$url"
          mkdir -p sb_bin && tar -xzf sb.tar.gz -C sb_bin
          cp "$(find sb_bin -name sing-box -type f | head -1)" qipcall_client/sing-box
          chmod +x qipcall_client/sing-box
      - name: Download routing data (geoip/geosite)
        run: |
          curl -L -o qipcall_client/geoip.dat   "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          curl -L -o qipcall_client/geosite.dat "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
      - name: Download font (Inter)
        run: |
          curl -L -o qipcall_client/Inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
      - name: Download flags
        run: |
          mkdir -p qipcall_client/flags
          for cc in fr de fi us my nl ru gb pl se tr jp sg ca es it ua lv ee lt ch at hk kr in ae kz ge no dk is ie be pt gr cz sk hu ro bg rs hr si md by am az cy lu mt br mx ar cl co pe cn tw vn th id ph au nz il sa qa bh kw om eg za ng ma ir iq pk bd lk np uz kg tj tm mn; do
            curl -sL "https://flagcdn.com/w80/$cc.png" -o "qipcall_client/flags/$cc.png" || true
          done
      - name: Build Linux binary
        working-directory: qipcall_client
        run: |
          pyinstaller --noconfirm --onefile \
            --name "Zyng-linux" \
            --collect-all customtkinter \
            --hidden-import yaml \
            --add-binary "xray:." \
            --add-binary "sing-box:." \
            --add-data "geoip.dat:." \
            --add-data "geosite.dat:." \
            --add-data "Inter.ttf:." \
            --add-data "logo_white.png:." \
            --add-data "orb_on.png:." \
            --add-data "orb_off.png:." \
            --add-data "flags:flags" \
            qipcall.py
      - name: Publish release (zyng)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyng
          name: Zyng VPN
          files: qipcall_client/dist/Zyng-linux
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

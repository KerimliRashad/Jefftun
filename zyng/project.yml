name: Zyng

# Описание проекта для XcodeGen. Всё, что раньше настраивалось руками в Xcode
# (capabilities, entitlements, пути, вложение расширения в приложение), теперь
# описано здесь. Команда `xcodegen` собирает из этого Zyng.xcodeproj.
#
# Если Xcode-проект когда-нибудь сломается — удали Zyng.xcodeproj и выполни
# `xcodegen` заново. Это безопасно: .xcodeproj целиком выводится из этого файла.

options:
  bundleIdPrefix: online.zyng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # Команда прописана явно. Раньше её подставлял Xcode, и после каждого
    # `rm -rf Zyng.xcodeproj && ./setup.sh` она слетала. Если Team пуст хотя бы
    # у одного таргета, вложенное расширение остаётся без подписи, и система
    # убивает приложение на старте — SIGKILL прямо в dyld, ещё до нашего кода.
    DEVELOPMENT_TEAM: P5FHU4567B
    SWIFT_VERSION: "5.0"
    # ВАЖНО: nonisolated, а не MainActor. Настройка MainActor делает каждый тип
    # main-actor-изолированным, включая PacketTunnelProvider — а система вызывает
    # его с фоновых потоков. Это ломало сборку и подвешивало расширение.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # То, что Xcode предлагает в окне «Update to recommended settings».
    # Соглашаться там нельзя: он правит Zyng.xcodeproj, а его перезапишет
    # следующий ./setup.sh — и окно вылезет снова. Значение задаём здесь.
    # На сам код не влияет: строковых каталогов у нас нет, переводы живут
    # в Shared/L10n.swift.
    LOCALIZED_STRING_SYMBOL_GENERATION: YES

    # Обычный бинарник вместо связки «заглушка + отладочная библиотека».
    #
    # Xcode 16 по умолчанию собирает приложение в две части: крошечный
    # исполняемый файл-загрузчик и Zyng.debug.dylib со всем настоящим кодом.
    # Сделано это ради предпросмотра SwiftUI. Узнать такую сборку легко —
    # у главного бинарника подпись в 500 байт вместо десятков килобайт.
    #
    # С нашим набором расширений эта схема ломается: dyld убивает процесс
    # SIGKILL прямо на загрузке подставленной библиотеки, ещё до первой нашей
    # инструкции. В стеке при этом только loadInsertedLibraries и
    # createMinimalInfo, память 0 КБ — понять по такому следу нечего, и
    # выглядит это как «приложение вообще не открывается».
    #
    # Предпросмотром мы не пользуемся, поэтому просто собираем как раньше:
    # один обычный бинарник, который дальше грузится сам собой.
    ENABLE_DEBUG_DYLIB: NO

    # Глушим предупреждение nullability из заголовка ядра — на весь проект.
    #
    # Libbox.objc.h пишет gomobile: это машинный перевод интерфейсов Go в
    # Objective-C, и в одном месте он объявляет init как nullable там, где выше
    # по цепочке тот же метод помечен nonnull. Исправить нечего — файл
    # создаётся заново при каждой сборке ядра.
    #
    # Раньше настройка стояла только у расширения туннеля, и предупреждение всё
    # равно всплывало: модуль с этим заголовком собирается через кэш, общий для
    # проекта, и одного таргета оказалось мало. -Xcc передаёт флаг тому
    # компилятору C, которого зовёт Swift, — без него до заголовка не доходит
    # ни один флаг из OTHER_CFLAGS.
    OTHER_CFLAGS: [-Wno-nullability]
    OTHER_SWIFT_FLAGS: [-Xcc, -Wno-nullability]

# Схемы задаём явно. Без этого XcodeGen их не пишет вовсе, а Xcode создаёт
# сам и не всегда все: в списке оставались только расширения, схемы приложения
# не было — и пункт Product → Archive оказывался недоступен.
schemes:

  Zyng:
    build:
      targets:
        Zyng: all
    run:
      config: Debug
      # Xcode при запуске подсовывает приложению свои отладочные библиотеки
      # через DYLD_INSERT_LIBRARIES. Если подпись установленной на устройстве
      # копии не совпадает с той, чем подписывает Xcode, dyld не может их
      # загрузить и убивает процесс ещё до нашего кода — SIGKILL со стеком
      # loadInsertedLibraries. Приложению они не нужны, поэтому выключаем.
      disableMainThreadChecker: true

      # Запускаем БЕЗ отладчика.
      #
      # Это и есть галочка «Debug executable» в схеме. С ней Xcode впрыскивает
      # в приложение свои отладочные библиотеки, а на iOS 26.4 они не грузятся:
      # процесс убивают сигналом SIGKILL прямо в dyld, до первой нашей
      # инструкции. В стеке при этом видны loadInsertedLibraries и
      # forEachInsertedDylib, память 0 КБ.
      #
      # Снять галочку руками мало: схему создаёт xcodegen из этого файла, и
      # после каждой пересборки проекта настройка возвращалась. Отсюда и
      # бесконечный круг «заработало — пересобрал — снова SIGKILL».
      #
      # Точки останова и пошаговая отладка при этом недоступны, но вывод NSLog
      # в консоль идёт по-прежнему — а он у нас и есть основной инструмент.
      # Когда Xcode догонит iOS на телефоне, эту строку можно будет убрать.
      debugEnabled: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:

  Zyng:
    type: application
    platform: iOS
    sources:
      - path: Zyng
      - path: Shared
    dependencies:
      # Это и есть «Embed App Extensions» — расширение вкладывается в .app само.
      - target: ZyngTunnel
        embed: true
      - target: ZyngWidgets
        embed: true
      - sdk: NetworkExtension.framework
      # Ядро приложению не нужно: с ним работает только расширение.
      # Раньше фреймворк встраивался сюда — но gomobile собирает его статически,
      # и dyld убивал приложение на старте, не найдя в бандле настоящую dylib.
      #
      # А вот libresolv нужна и здесь. Ядра собраны статически и вкладываются в
      # расширение, но линковщик приложения всё равно упирается в их символы
      # системного резолвера — res_9_ninit, res_9_nclose, res_9_nsearch.
      # Это системная заглушка, своего кода она не приносит.
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.zyng.Zyng
        PRODUCT_NAME: Zyng
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "86"
        CODE_SIGN_ENTITLEMENTS: Zyng/Zyng.entitlements
        INFOPLIST_FILE: Zyng/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  ZyngTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ZyngTunnel
      - path: Shared
    dependencies:
      - sdk: NetworkExtension.framework
      # Оба ядра одной библиотекой: sing-box (Libbox*) держит туннель, Xray
      # (LibXray*) исполняет транспорт xhttp, которого в sing-box нет.
      #
      # Именно одной, а не двумя. gomobile кладёт в каждую библиотеку полную
      # копию среды выполнения Go, и две таких в одном бинарнике линковщик не
      # принимает — падает на дубликатах __cgo_topofstack, _crosscall2,
      # _IncGoRef и прочих внутренностей Go. Собирается ./build-core.sh,
      # в git не хранится: большая и пересобирается командой.
      #
      # Библиотека статическая: её код попадает прямо в бинарник расширения,
      # поэтому embed выключен — копировать в бандл нечего.
      - framework: Frameworks/Libcore.xcframework
        embed: false
        link: true
      # Сетевой код Go зовёт системный резолвер (res_9_ninit и соседи).
      # Без этой библиотеки линковка расширения падает на неизвестных символах.
      - sdk: libresolv.tbd
    settings:
      base:
        # Bundle ID расширения обязан начинаться с Bundle ID приложения.
        PRODUCT_BUNDLE_IDENTIFIER: online.zyng.Zyng.ZyngTunnel
        PRODUCT_NAME: ZyngTunnel
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "86"
        CODE_SIGN_ENTITLEMENTS: ZyngTunnel/ZyngTunnel.entitlements
        INFOPLIST_FILE: ZyngTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO

        # Глушим предупреждения о nullability из заголовка ядра.
        #
        # Libbox.objc.h пишет gomobile — это машинный перевод интерфейсов Go в
        # Objective-C, и он объявляет init как nullable там, где выше по цепочке
        # тот же метод уже помечен nonnull. Компилятор честно об этом сообщает,
        # но исправить нечего: файл создаётся заново при каждой сборке ядра.
        #
        # Глушим ровно эту проверку и только у расширения — единственного
        # таргета, который вообще видит заголовок. Наш собственный код
        # проверяется как обычно, а чужое неисправимое предупреждение больше не
        # прячет за собой настоящие.

  ZyngWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ZyngWidgets
      # Описание Live Activity общее с приложением: одна и та же структура
      # должна компилироваться в оба таргета, иначе система их не свяжет.
      - path: Shared/TunnelActivity.swift
      # Строки виджета тоже переводятся. Настройки приложения виджету
      # недоступны — он отдельный процесс, — поэтому язык он берёт из системы.
      - path: Shared/L10n.swift
      # Отсюда виджету нужен только идентификатор App Group: через него он
      # читает общие настройки. Держим его в одном месте, а не копией.
      - path: Shared/TunnelDiagnostics.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      # Переключатель в Пункте управления работает через App Intent, а сам
      # туннель поднимает через NetworkExtension.
      - sdk: AppIntents.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.zyng.Zyng.ZyngWidgets
        PRODUCT_NAME: ZyngWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "86"
        CODE_SIGN_ENTITLEMENTS: ZyngWidgets/ZyngWidgets.entitlements
        INFOPLIST_FILE: ZyngWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

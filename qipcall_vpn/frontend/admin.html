<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeffTUN VPN — Панель</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root{--bg:#0a0e17;--card:#131926;--acc:#5b8def;--acc2:#7c5cff;--text:#e8edf5;--muted:#8a97ad;--ok:#3fce6a;--danger:#f87171}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  h1{font-size:24px;font-weight:900;margin-bottom:20px}
  h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .field{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--text);font-size:15px;outline:none}
  .btn{padding:11px 18px;border-radius:10px;font-weight:700;border:none;cursor:pointer;font-size:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
  .btn.sec{background:rgba(255,255,255,.08);color:var(--text)}
  .btn.danger{background:rgba(248,113,113,.15);color:var(--danger)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px;margin-bottom:16px}
  .login{max-width:360px;margin:14vh auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px;text-align:center}
  .stat .v{font-size:26px;font-weight:900;color:var(--acc)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  .row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
  .row .info{flex:1;min-width:180px}
  .row .name{font-weight:700}
  .row .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .badge.ok{background:rgba(63,206,106,.15);color:var(--ok)}
  .badge.off{background:rgba(248,113,113,.15);color:var(--danger)}
  .create-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .err{color:var(--danger);font-size:13px;min-height:18px}
  .sub-link{font-size:11px;color:var(--acc);word-break:break-all;font-family:monospace;background:rgba(0,0,0,.3);padding:8px;border-radius:8px;margin-top:6px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:12px 18px;display:none;z-index:200}
  .toast.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="card">
      <h1>Jeff<span>TUN</span> · Панель</h1>
      <label>Пароль администратора</label>
      <input class="field" type="password" id="pw" placeholder="Пароль" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')login()">
      <button class="btn" style="width:100%" onclick="login()">Войти</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panel" style="display:none">
    <h1>Jeff<span>TUN</span> VPN · Панель</h1>
    <div class="stats" id="stats"></div>

    <div class="card">
      <h3 style="margin-bottom:12px">⬇ Скачивания приложения</h3>
      <div id="downloads" style="color:var(--muted)">Загрузка...</div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">➕ Новый пользователь</h3>
      <div class="create-grid">
        <div><label>Имя</label><input class="field" id="c-name" placeholder="user1"></div>
        <div><label>Срок (дней, 0=∞)</label><input class="field" id="c-days" type="number" value="30"></div>
        <div><label>Трафик (ГБ, 0=∞)</label><input class="field" id="c-traffic" type="number" value="0"></div>
        <div><label>Тариф</label><input class="field" id="c-plan" value="basic"></div>
      </div>
      <button class="btn" onclick="createUser()">Создать</button>
      <div class="err" id="c-err"></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px">🌍 Серверы (страны)</h3>
      <div class="create-grid">
        <div><label>Название</label><input class="field" id="s-name" placeholder="France - быстрый"></div>
        <div><label>Хост/IP</label><input class="field" id="s-host" placeholder="1.2.3.4"></div>
        <div><label>Порт</label><input class="field" id="s-port" type="number" value="443"></div>
        <div><label>Public key</label><input class="field" id="s-pbk" placeholder="pbk..."></div>
        <div><label>Short id</label><input class="field" id="s-sid" placeholder="0123abcd"></div>
        <div><label>SNI</label><input class="field" id="s-sni" value="www.microsoft.com"></div>
      </div>
      <button class="btn" onclick="createServer()">Добавить сервер</button>
      <div class="err" id="s-err"></div>
      <div id="servers" style="margin-top:12px"></div>
    </div>

    <div id="users"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let token=localStorage.getItem('vpn_admin');
const API=`https://${location.hostname}:8443`;

if(token) showPanel();

async function login(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('login-err');err.textContent='';
  const fd=new FormData();fd.append('password',pw);
  try{
    const r=await fetch(`${API}/api/admin/login`,{method:'POST',body:fd});
    if(!r.ok){err.textContent='Неверный пароль';return}
    const d=await r.json();token=d.token;localStorage.setItem('vpn_admin',token);showPanel();
  }catch{err.textContent='Сервер недоступен'}
}

function showPanel(){
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  loadStats();loadServers();loadUsers();loadDownloads();
}

async function loadDownloads(){
  const el=document.getElementById('downloads');
  try{
    const r=await fetch(`${API}/api/admin/downloads`,{headers:hdr()});
    const d=await r.json();
    if(!d.assets||!d.assets.length){el.textContent='Пока нет данных';return}
    el.innerHTML=`<div style="font-size:28px;font-weight:900;color:var(--acc)">${d.total}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">всего скачиваний</div>`+
      d.assets.map(a=>`<div class="sub" style="display:flex;justify-content:space-between;padding:4px 0">
        <span>${a.name}</span><b style="color:var(--text)">${a.count}</b></div>`).join('');
  }catch{el.textContent='Ошибка загрузки'}
}

function hdr(){return{'Authorization':'Bearer '+token}}

async function loadServers(){
  const r=await fetch(`${API}/api/admin/servers`,{headers:hdr()});
  if(!r.ok)return;
  const servers=await r.json();
  const el=document.getElementById('servers');el.innerHTML='';
  servers.forEach(s=>{
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`<div class="info"><div class="name">#${s.id} ${esc(s.name)} ${s.is_active?'':'⛔'}</div>
      <div class="sub">${esc(s.host)}:${s.port} · sni ${esc(s.sni)}</div></div>
      <button class="btn sm danger" onclick="delServer(${s.id})">🗑</button>`;
    el.appendChild(d);
  });
}
async function createServer(){
  const err=document.getElementById('s-err');err.textContent='';
  const body={
    name:document.getElementById('s-name').value.trim(),
    host:document.getElementById('s-host').value.trim(),
    port:+document.getElementById('s-port').value||443,
    public_key:document.getElementById('s-pbk').value.trim(),
    short_id:document.getElementById('s-sid').value.trim(),
    sni:document.getElementById('s-sni').value.trim()||'www.microsoft.com',
  };
  if(!body.name||!body.host){err.textContent='Название и хост обязательны';return}
  const r=await fetch(`${API}/api/admin/servers`,{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){err.textContent='Ошибка';return}
  document.getElementById('s-name').value='';document.getElementById('s-host').value='';
  toast('Сервер добавлен ✓');loadServers();
}
async function delServer(id){
  if(!confirm('Удалить сервер?'))return;
  await fetch(`${API}/api/admin/servers/${id}`,{method:'DELETE',headers:hdr()});
  toast('Удалён');loadServers();
}
async function setUserServers(id,cur){
  const v=prompt('ID серверов через запятую (пусто = все страны):',cur||'');
  if(v===null)return;
  await fetch(`${API}/api/admin/users/${id}/servers`,{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({server_ids:v})});
  toast('Страны обновлены ✓');loadUsers();
}

async function loadStats(){
  const r=await fetch(`${API}/api/admin/stats`,{headers:hdr()});
  if(r.status===401){logout();return}
  const s=await r.json();
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="v">${s.total}</div><div class="l">Всего</div></div>
    <div class="stat"><div class="v" style="color:var(--ok)">${s.active}</div><div class="l">Активны</div></div>
    <div class="stat"><div class="v">${s.expired}</div><div class="l">Истекли</div></div>
    <div class="stat"><div class="v">${(s.traffic_used/1073741824).toFixed(1)}</div><div class="l">ГБ трафика</div></div>`;
}

async function loadUsers(){
  const r=await fetch(`${API}/api/admin/users`,{headers:hdr()});
  if(r.status===401){logout();return}
  const users=await r.json();
  const el=document.getElementById('users');el.innerHTML='';
  if(!users.length){el.innerHTML='<div class="card" style="text-align:center;color:var(--muted)">Нет пользователей</div>';return}
  users.forEach(u=>{
    const exp=u.expires_at?new Date(u.expires_at).toLocaleDateString('ru'):'∞';
    const traf=u.traffic_limit?`${(u.traffic_used/1073741824).toFixed(1)}/${(u.traffic_limit/1073741824).toFixed(0)} ГБ`:'безлимит';
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`
      <div class="info">
        <div class="name">${esc(u.name)} <span class="badge ${u.enabled?'ok':'off'}">${u.enabled?'активен':(u.is_expired?'истёк':'выкл')}</span></div>
        <div class="sub">Тариф: ${esc(u.plan)} · до ${exp} · ${traf}</div>
        <div class="sub-link">${u.sub_url}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm sec" onclick="copyLink('${u.sub_url}')">📋 Копир.</button>
        <button class="btn sm sec" onclick="addDays(${u.id})">+30 дн</button>
        <button class="btn sm sec" onclick="setUserServers(${u.id},'${u.server_ids||''}')">🌍 Страны</button>
        <button class="btn sm sec" onclick="toggleUser(${u.id},${!u.is_active})">${u.is_active?'⏸ Выкл':'▶ Вкл'}</button>
        <button class="btn sm danger" onclick="delUser(${u.id})">🗑</button>
      </div>`;
    el.appendChild(d);
  });
}

async function createUser(){
  const err=document.getElementById('c-err');err.textContent='';
  const body={
    name:document.getElementById('c-name').value.trim(),
    days:+document.getElementById('c-days').value||0,
    traffic_gb:+document.getElementById('c-traffic').value||0,
    plan:document.getElementById('c-plan').value.trim()||'basic',
  };
  if(!body.name){err.textContent='Укажите имя';return}
  const r=await fetch(`${API}/api/admin/users`,{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const d=await r.json();err.textContent=d.detail||'Ошибка';return}
  document.getElementById('c-name').value='';
  toast('Пользователь создан ✓');loadStats();loadUsers();
}

async function addDays(id){
  await fetch(`${API}/api/admin/users/${id}`,{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({add_days:30})});
  toast('+30 дней ✓');loadUsers();
}
async function toggleUser(id,active){
  await fetch(`${API}/api/admin/users/${id}`,{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({is_active:active})});
  loadStats();loadUsers();
}
async function delUser(id){
  if(!confirm('Удалить пользователя?'))return;
  await fetch(`${API}/api/admin/users/${id}`,{method:'DELETE',headers:hdr()});
  toast('Удалён');loadStats();loadUsers();
}
function copyLink(url){navigator.clipboard.writeText(url).then(()=>toast('Ссылка скопирована ✓'))}
function logout(){localStorage.removeItem('vpn_admin');location.reload()}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;')}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2500)}
</script>
</body>
</html>
